<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Secure Portal | Decentralized Authentication</title>
    <style>
        :root {
            --bg-color: #05050a;
            --panel-bg: rgba(13, 13, 24, 0.7);
            --border-color: rgba(120, 119, 198, 0.15);
            --accent-primary: #00ffcc;
            --accent-secondary: #7928ca;
            --text-main: #ffffff;
            --text-muted: #8a8f98;
            --font-mono: 'JetBrains Mono', monospace, Courier, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --whatsapp-green: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .matrix-bg {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }

        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            opacity: 0.15;
        }

        .orb-1 { top: -10%; left: -10%; background: var(--accent-secondary); }
        .orb-2 { bottom: -10%; right: -10%; background: var(--accent-primary); }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 204, 0.08);
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--accent-primary);
            margin-bottom: 24px;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-primary);
            animation: pulse 2s infinite;
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
        }
                .wallet-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 24px;
            transition: all 0.3s ease;
        }

        .wallet-card.connected {
            border-color: rgba(0, 255, 204, 0.4);
            background: rgba(0, 255, 204, 0.03);
        }

        .wallet-info span {
            display: block;
            font-size: 14px;
            font-weight: 500;
        }

        .wallet-info .sub-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            font-family: var(--font-mono);
        }
        /* Form Inputs Style Expansion */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
        }

        .step-indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .step-indicator .step.active {
            color: var(--accent-primary);
        }

        .step-indicator .line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
            margin: 0 8px;
        }
        .btn-container {
  display: flex;
  justify-content: center;
  align-items: center; /* Centers it vertically if the container has a defined height */
  width: 100%;
}


        .action-btn {
  background: transparent;
  border: none;
  padding: 8px; /* Gives the tap target some breathing room */
  cursor: pointer;
  border-radius: 50%; /* Keeps the boundary strictly circular */
  position: relative;
  overflow: hidden; /* Clips the background effect into a circle */
  
  /* Reset default styles */
  -webkit-tap-highlight-color: transparent;
  outline: none;
  
  /* Smooth transition for the release state */
  transition: background-color 0.3s ease;
}

/* Base hover state (Desktop) */
@media (hover: hover) {
  .action-btn:hover {
    background-color: rgba(0, 0, 0, 0.05); /* Soft background on hover */
  }
}

/* Pseudo-element that acts as the expanding "fade circle" when pressed */
.action-btn::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.12); /* Color of the flash/fade */
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  transition: transform 0s, opacity 0s; /* Instant reset on release */
}

/* Triggers when clicked or tapped */
.action-btn:active::after {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
  transition: transform 0.2s ease-out, opacity 0.2s ease-out;
}


        .security-log {
            margin-top: 24px;
            background: #020205;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 10px;
        }

        .log-title {
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .log-title span { color: var(--accent-primary); }

        .log-content {
            color: #4ade80;
            line-height: 1.4;
            max-height: 80px;
            overflow-y: auto;
        }

        .error-text {
            color: #ef4444;
            font-family: var(--font-mono);
            font-size: 11px;
            margin-top: 8px;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--accent-primary); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        /* Full-screen overlay background */
.fullscreen-loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.85); /* Semi-transparent dark overlay */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Ensures it sits on top of everything */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

/* Make it active via class */
.fullscreen-loader-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

/* The spinning graphic */
.fullscreen-spinner {
    width: 50px;
    height: 50px;
    border: 5px solid rgba(0, 255, 204, 0.2); /* Faint track color matching terminal theme */
    border-top: 5px solid #00ffcc; /* Vibrant spinning arc */
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
/* Styling adjustments to seamlessly blend with your cyber/matrix UI */
    .security-badge.offline {
        border-color: #ff3b30 !important;
        background: rgba(255, 59, 48, 0.1) !important;
    }
    .security-badge.offline .pulse-dot {
        background: #ff3b30 !important;
        box-shadow: 0 0 8px #ff3b30 !important;
        animation: none !important; /* Stop pulsing if disconnected to signal a hardware halt */
    }
    .security-badge.offline span {
        color: #ff3b30 !important;
    }
    /* Your existing form/button styles here */
        #authForm button {
            transition: all 0.2s ease; /* Smooth transition when switching states */
        }

        /* --- OFFLINE/DISABLED VISUAL STATE FOR SVG BUTTON --- */
#authForm button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none !important;
}

/* Targets the main circle or background shape inside the SVG */
#authForm button:disabled svg circle,
#authForm button:disabled svg .btn-bg {
    fill: #4b5563; 
    stroke: #374151;
}

/* Targets the icon, path, or text inside the SVG */
#authForm button:disabled svg path,
#authForm button:disabled svg text,
#authForm button:disabled svg .btn-icon {
    fill: #9ca3af;
    stroke: #9ca3af; /* Include only if your icon uses strokes instead of fills */
    filter: grayscale(100%);
}

    </style>
</head>

        window.location.href = REDIRECT_TARGET;
    } else {
        console.error("Invalid credentials");
    }
}

    const form = document.getElementById('authForm');
    const errorDisplay = document.getElementById('errorDisplay');
    const logTerminal = document.getElementById('logTerminal');
    const fullscreenLoader = document.getElementById('fullscreenLoader');
    
    // Select the submit button inside the form
    const submitButton = form.querySelector('button[type="submit"]') || document.querySelector('button');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Extra guard clause in case the button's disabled state is bypassed manually
        if (!navigator.onLine) {
            return;
        }

        const inputUserId = document.getElementById('userId').value.trim();
        const inputPassword = document.getElementById('password').value;

        // Trigger the full-screen loader immediately for both success and failure
        fullscreenLoader.classList.add('active');

        if (inputUserId === AUTHORIZED_USER_ID && inputPassword === AUTHORIZED_PASSWORD) {
            errorDisplay.style.display = 'none';
            logTerminal.innerHTML += "<br><span style='color: #00ffcc;'>✔ Credentials Verified! Signing in...</span>";
            
            // Redirect user after the delay
            setTimeout(() => {
                window.location.href = REDIRECT_TARGET;
            }, 1500);
        } else {
            // Keep loader active for 1.5 seconds, then remove it and show the error
            setTimeout(() => {
                fullscreenLoader.classList.remove('active');
                errorDisplay.style.display = 'block';
                logTerminal.innerHTML += "<br><span style='color: #ef4444;'>⚠︎ AUTH FAILED: Incorrect User ID or Password</span>";
            }, 1500);
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const badge = document.getElementById('networkBadge');
        const text = document.getElementById('networkText');
        const terminal = document.getElementById('logTerminal');

        function updateNetworkStatus() {
            if (navigator.onLine) {
                badge.classList.remove('offline');
                badge.classList.add('online');
                text.textContent = 'Online';
                
                // Enable the button when online
                if (submitButton) submitButton.disabled = false;
                
                // Print connection restoration message to system log
                if(terminal) {
                    terminal.innerHTML += `<br><span style="color: #4cd964">⁌ Connection established.</span>`;
                }
            } else {
                badge.classList.remove('online');
                badge.classList.add('offline');
                text.textContent = 'Offline';
                
                // Disable the button when offline
                if (submitButton) submitButton.disabled = true;
                
                // Print warning alert to system log
                if(terminal) {
                    terminal.innerHTML += `<br><span style="color: #ff3b30">⁌ ALERT: Login state down. Operations restricted.</span>`;
                }
            }
        }

        // Initialize state check on mount
        updateNetworkStatus();

        // Listen for hardware network status switches
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);
    });
</script>

</body>
